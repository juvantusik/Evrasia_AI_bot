        challenge_type: {type: string, enum: [totp, email, sms]}
        expires_in: {type: integer, minimum: 1, maximum: 300}
    Authenticated:
      type: object
      required: [status, access_token, refresh_token]
      properties:
        status: {type: string, const: authenticated}
        access_token: {type: string}
        refresh_token: {type: string}
  requestBodies:
    Agreements:
      required: true
      content:
        application/json:
          schema:
