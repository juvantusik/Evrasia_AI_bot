              code: {type: string, pattern: '^[0-9]{6}$'}
              device_id: {type: string, pattern: '^sz_[a-f0-9]{64}$'}
              platform: {type: string, enum: [ios, android]}
    ChallengeAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [challenge_id, device_id, platform]
            properties:
              challenge_id: {type: string, pattern: '^[a-f0-9]{64}$'}
              device_id: {type: string, pattern: '^sz_[a-f0-9]{64}$'}
              platform: {type: string, enum: [ios, android]}
    AccessToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [access_token]
            properties:
              access_token: {type: string, writeOnly: true}
