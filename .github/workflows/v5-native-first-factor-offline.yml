name: V5 first-factor and public admission offline

on:
  push:
    branches:
      - feature/samzaberu-api-v5-auth-contract
    paths:
      - '.github/workflows/v5-native-first-factor-offline.yml'
      - 'site-integration/samzaberu-v5/src/**'
      - 'site-integration/samzaberu-v5/tests/V5BitrixNativeFirstFactorCompositionTest.php'
      - 'site-integration/samzaberu-v5/tests/V5BitrixNativeLoginPolicyLimitsTest.php'
      - 'site-integration/samzaberu-v5/tests/V5BitrixNativePasswordLoginAdmissionTest.php'
      - 'site-integration/samzaberu-v5/tests/V5BitrixPasswordProofPortTest.php'
      - 'site-integration/samzaberu-v5/tests/V5FirstFactorAttemptGateTest.php'
      - 'site-integration/samzaberu-v5/tests/V5BitrixMfaAdmissionGuardsTest.php'
      - 'site-integration/samzaberu-v5/tests/V5PublicTrafficPreflightTest.php'
      - 'site-integration/samzaberu-v5/tests/V5MySqlPublicCompositionTest.php'
      - 'site-integration/samzaberu-v5/tests/V5UnavailableSmsLifecycleTest.php'
      - 'site-integration/samzaberu-v5/tests/V5SmsDispatchBudgetTest.php'
      - 'site-integration/samzaberu-v5/tests/V5MySqlSmsOutboxTest.php'
      - 'site-integration/samzaberu-v5/tests/V5SeparatedFactorLifecycleTest.php'
      - 'site-integration/samzaberu-v5/tests/AuthDecisionTest.php'
      - 'site-integration/samzaberu-v5/tests/V5LoginWorkflowTest.php'
      - 'site-integration/samzaberu-v5/tests/V5AuthHttpHandlerTest.php'
      - 'site-integration/samzaberu-v5/tests/V5ManualSmsFallbackHttpTest.php'
      - 'site-integration/samzaberu-v5/tests/V5SamzaberuSecondFactorPolicyTest.php'
      - 'site-integration/samzaberu-v5/tests/V5EmailNativeSqlAllowlistTest.php'
      - 'site-integration/samzaberu-v5/tests/V5EmailLedgerSchemaContractTest.php'
      - 'site-integration/samzaberu-v5/schema/PROPOSED_ev_v5_email_auth_challenges.sql'
      - 'site-integration/samzaberu-v5/tests/V5BitrixEmailOtpTransportTest.php'
      - 'site-integration/samzaberu-v5/tests/V5BitrixCurrentEmailLoginTemplateProofTest.php'
      - 'site-integration/samzaberu-v5/tests/V5ExistingWebsiteEmailBudgetTest.php'
      - 'site-integration/samzaberu-v5/tests/WebsiteEmailSendBudgetTest.php'
      - 'site-integration/samzaberu-v5/deployment/website-mfa/EmailSendBudget.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-factor-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout feature source without persisted credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Guard CI environment and PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== 1. ENVIRONMENT ==='
          test "$GITHUB_ACTIONS" = true
          test "$(hostname -s)" != evrasia
          test "$(hostname -s)" != eur-bot-01
          echo 'MODE=CI_OFFLINE_ONLY'
          echo 'PRODUCTION_DATABASE_CONNECTION=NO'
          echo 'PRODUCTION_CODE_WRITE=NO'
          echo 'BITRIX_BOOTSTRAP=NO'
          echo 'SMS_SENT=NO'
          php -v | head -n 1
          php -m | grep -Fxq PDO
          echo 'PASS: GitHub runner and PHP PDO'

      - name: Lint real first-factor and public V5 composition
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== 2. PHP SYNTAX ==='
          for file in \
            site-integration/samzaberu-v5/src/V5BitrixNativeFirstFactorComposition.php \
            site-integration/samzaberu-v5/src/V5PinnedBitrixPasswordComparator.php \
            site-integration/samzaberu-v5/src/V5PinnedBitrixMfaPolicies.php \
            site-integration/samzaberu-v5/src/V5BitrixMfaAdmissionGuards.php \
            site-integration/samzaberu-v5/src/V5BitrixNativeLoginPolicyLimits.php \
            site-integration/samzaberu-v5/src/V5BitrixNativePasswordLoginAdmission.php \
            site-integration/samzaberu-v5/src/V5BitrixPasswordProofPort.php \
            site-integration/samzaberu-v5/src/V5PublicTrafficPreflight.php \
            site-integration/samzaberu-v5/src/V5MySqlPublicComposition.php \
            site-integration/samzaberu-v5/src/V5SmsDispatchBudget.php \
            site-integration/samzaberu-v5/src/V5MySqlSmsOutbox.php \
            site-integration/samzaberu-v5/src/V5SeparatedFactorLifecycle.php \
            site-integration/samzaberu-v5/src/V5PublicFactorKindAdapter.php \
            site-integration/samzaberu-v5/src/V5UnavailableSmsLifecycle.php \
            site-integration/samzaberu-v5/src/V5MySqlChallengeConsumption.php \
            site-integration/samzaberu-v5/src/V5MySqlEmailOtp.php \
            site-integration/samzaberu-v5/src/V5ExistingWebsiteEmailBudget.php \
            site-integration/samzaberu-v5/deployment/website-mfa/EmailSendBudget.php \
            site-integration/samzaberu-v5/src/V5BitrixPdoCompatibilityBridge.php \
            site-integration/samzaberu-v5/src/V5BitrixLockedEmailOtpProof.php \
            site-integration/samzaberu-v5/src/V5BitrixEmailOtpTransport.php \
            site-integration/samzaberu-v5/src/V5BitrixCurrentEmailLoginTemplateProof.php \
            site-integration/samzaberu-v5/src/V5MySqlConsumedEmailGrantProof.php \
            site-integration/samzaberu-v5/src/V5MySqlConsumedChallengeProof.php \
            site-integration/samzaberu-v5/src/V5MySqlStrongSessionStore.php \
            site-integration/samzaberu-v5/src/V5SessionAssurancePolicy.php \
            site-integration/samzaberu-v5/tests/V5BitrixNativeFirstFactorCompositionTest.php \
            site-integration/samzaberu-v5/tests/V5BitrixMfaAdmissionGuardsTest.php \
            site-integration/samzaberu-v5/tests/V5BitrixNativeLoginPolicyLimitsTest.php \
            site-integration/samzaberu-v5/tests/V5BitrixNativePasswordLoginAdmissionTest.php \
            site-integration/samzaberu-v5/tests/V5BitrixPasswordProofPortTest.php \
            site-integration/samzaberu-v5/tests/V5FirstFactorAttemptGateTest.php \
            site-integration/samzaberu-v5/tests/V5PublicTrafficPreflightTest.php \
            site-integration/samzaberu-v5/tests/V5MySqlPublicCompositionTest.php \
            site-integration/samzaberu-v5/tests/V5UnavailableSmsLifecycleTest.php \
            site-integration/samzaberu-v5/tests/V5SmsDispatchBudgetTest.php \
            site-integration/samzaberu-v5/tests/V5MySqlSmsOutboxTest.php \
            site-integration/samzaberu-v5/tests/V5SeparatedFactorLifecycleTest.php \
            site-integration/samzaberu-v5/tests/AuthDecisionTest.php \
            site-integration/samzaberu-v5/tests/V5LoginWorkflowTest.php \
            site-integration/samzaberu-v5/tests/V5AuthHttpHandlerTest.php \
            site-integration/samzaberu-v5/tests/V5ManualSmsFallbackHttpTest.php \
            site-integration/samzaberu-v5/tests/V5SamzaberuSecondFactorPolicyTest.php \
            site-integration/samzaberu-v5/tests/V5EmailNativeSqlAllowlistTest.php \
            site-integration/samzaberu-v5/tests/V5EmailLedgerSchemaContractTest.php \
            site-integration/samzaberu-v5/tests/V5BitrixEmailOtpTransportTest.php \
            site-integration/samzaberu-v5/tests/V5BitrixCurrentEmailLoginTemplateProofTest.php \
            site-integration/samzaberu-v5/tests/V5ExistingWebsiteEmailBudgetTest.php \
            site-integration/samzaberu-v5/tests/WebsiteEmailSendBudgetTest.php; do
            php -l "$file"
          done
          echo 'PHP_LINT=PASS'

      - name: Offline provider dependency and denial tests
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== 3. TARGETED TESTS ==='
          php site-integration/samzaberu-v5/tests/V5PublicTrafficPreflightTest.php
          php site-integration/samzaberu-v5/tests/V5MySqlPublicCompositionTest.php
          php site-integration/samzaberu-v5/tests/V5UnavailableSmsLifecycleTest.php
          php site-integration/samzaberu-v5/tests/V5BitrixNativeFirstFactorCompositionTest.php
          php site-integration/samzaberu-v5/tests/V5BitrixMfaAdmissionGuardsTest.php
          php site-integration/samzaberu-v5/tests/V5BitrixNativeLoginPolicyLimitsTest.php
          php site-integration/samzaberu-v5/tests/V5BitrixNativePasswordLoginAdmissionTest.php
          php site-integration/samzaberu-v5/tests/V5BitrixPasswordProofPortTest.php
          php site-integration/samzaberu-v5/tests/V5FirstFactorAttemptGateTest.php
          php site-integration/samzaberu-v5/tests/V5SmsDispatchBudgetTest.php
          php site-integration/samzaberu-v5/tests/V5MySqlSmsOutboxTest.php
          php site-integration/samzaberu-v5/tests/V5SeparatedFactorLifecycleTest.php
          php site-integration/samzaberu-v5/tests/AuthDecisionTest.php
          php site-integration/samzaberu-v5/tests/V5LoginWorkflowTest.php
          php site-integration/samzaberu-v5/tests/V5AuthHttpHandlerTest.php
          php site-integration/samzaberu-v5/tests/V5ManualSmsFallbackHttpTest.php
          php site-integration/samzaberu-v5/tests/V5SamzaberuSecondFactorPolicyTest.php
          php site-integration/samzaberu-v5/tests/V5EmailNativeSqlAllowlistTest.php
          php site-integration/samzaberu-v5/tests/V5EmailLedgerSchemaContractTest.php
          php site-integration/samzaberu-v5/tests/V5BitrixEmailOtpTransportTest.php
          php site-integration/samzaberu-v5/tests/V5BitrixCurrentEmailLoginTemplateProofTest.php
          php site-integration/samzaberu-v5/tests/WebsiteEmailSendBudgetTest.php
          php site-integration/samzaberu-v5/tests/V5ExistingWebsiteEmailBudgetTest.php
          # Load the actual native EMAIL class graph, without MySQL,
          # Bitrix bootstrap, synthetic accounts or external mail.
          php -r 'require_once "site-integration/samzaberu-v5/src/V5BitrixLockedEmailOtpProof.php"; require_once "site-integration/samzaberu-v5/src/V5MySqlConsumedChallengeProof.php"; if (!class_exists("Evrasia\\Samzaberu\\V5\\V5BitrixLockedEmailOtpProof") || !class_exists("Evrasia\\Samzaberu\\V5\\V5MySqlConsumedEmailGrantProof")) exit(1);'
          php -r 'require_once "site-integration/samzaberu-v5/src/V5MySqlPublicComposition.php"; if (!method_exists("Evrasia\\Samzaberu\\V5\\V5MySqlPublicComposition", "buildEmailFirst") || !class_exists("Evrasia\\Samzaberu\\V5\\V5PublicFactorKindAdapter")) exit(1);'
          echo 'EMAIL_FIRST_PUBLIC_COMPOSITION_GRAPH=PASS'
          echo 'EMAIL_NATIVE_CLASS_GRAPH=PASS'
          echo 'FIRST_FACTOR_PUBLIC_GATES=PASS'

      - name: Final no-production attestation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== 4. RESULT ==='
          echo 'REAL_BITRIX_NATIVE_E2E=NOT_RUN'
          echo 'REAL_NATIVE_SECURITY_COVERAGE=NOT_ATTESTED'
          echo 'PRODUCTION_DATABASE_WRITE=NO'
          echo 'PRODUCTION_CODE_WRITE=NO'
          echo 'V4_CHANGED=NO'
          echo 'V5_ENABLED=NO'
          echo 'SMS_SENT=NO'
          echo 'FINAL_STATUS=PASS'
          echo 'FINAL_RC=0'
