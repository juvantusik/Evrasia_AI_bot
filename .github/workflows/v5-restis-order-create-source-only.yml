name: V5 RestIS order-create static trace
on:
  push:
    branches:
      - feature/v5-production-native-preflight-20261025
    paths:
      - .github/workflows/v5-restis-order-create-source-only.yml
      - site-integration/samzaberu-v5/tests/diagnostics/V5RestisOrderCreateTrace.php
      - site-integration/samzaberu-v5/tests/diagnostics/run_v5_restis_order_creation_readonly.sh
      - site-integration/samzaberu-v5/tests/diagnostics/run_v5_restis_event_boundary_readonly.sh
  workflow_dispatch:
jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP source tokenizer and shell parser syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          dir=site-integration/samzaberu-v5/tests/diagnostics
          php -l "$dir/V5RestisOrderCreateTrace.php"
          php "$dir/V5RestisOrderCreateTrace.php" --self-test
          bash -n "$dir/run_v5_restis_order_creation_readonly.sh"
          bash -n "$dir/run_v5_restis_event_boundary_readonly.sh"
