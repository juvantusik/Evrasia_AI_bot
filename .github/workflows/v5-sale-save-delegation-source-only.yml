name: V5 Sale save delegation source-only trace
on:
  push:
    branches:
      - feature/v5-production-native-preflight-20261025
    paths:
      - .github/workflows/v5-sale-save-delegation-source-only.yml
      - site-integration/samzaberu-v5/tests/diagnostics/V5SaleSaveDelegationTrace.php
      - site-integration/samzaberu-v5/tests/diagnostics/run_v5_sale_save_delegation_readonly.sh
  workflow_dispatch:
jobs:
  parser-syntax-and-mask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source-only parser PHP syntax and redaction
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=site-integration/samzaberu-v5/tests/diagnostics
          php -d auto_prepend_file= -d auto_append_file= -l "$BASE/V5SaleSaveDelegationTrace.php"
          php -d auto_prepend_file= -d auto_append_file= "$BASE/V5SaleSaveDelegationTrace.php" --self-test
          bash -n "$BASE/run_v5_sale_save_delegation_readonly.sh"
