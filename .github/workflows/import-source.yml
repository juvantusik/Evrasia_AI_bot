name: Import source snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SamZaberu_GitHub_Ready_v1.4.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          test -f SamZaberu_GitHub_Ready_v1.4.zip
          echo "f5c51d70f9bb203859e0d0a2b2e5af3180541aebfc09eec13bb627334b849590  SamZaberu_GitHub_Ready_v1.4.zip" | sha256sum -c -
          unzip -tq SamZaberu_GitHub_Ready_v1.4.zip

      - name: Import source files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/samzaberu-import
          mkdir -p /tmp/samzaberu-import
          unzip -q SamZaberu_GitHub_Ready_v1.4.zip -d /tmp/samzaberu-import
          test -d /tmp/samzaberu-import/SamZaberu_GitHub_Ready_v1.4
          cp -a /tmp/samzaberu-import/SamZaberu_GitHub_Ready_v1.4/. .
          rm -rf .import-v12
          rm -f source-import.zip ABANDONED.txt DIRECT_TREE_PROBE.md DIRECT_TREE_PROBE_2.md SamZaberu_GitHub_Ready_v1.2.zip SamZaberu_GitHub_Ready_v1.4.zip

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import SamZaberu source v1.4"
          git push origin main
