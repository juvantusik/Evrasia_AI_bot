name: Import source snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.import-v12/run.trigger'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          find .import-v12 -maxdepth 1 -type f -name 'part-*.txt' -print0 \
            | sort -zV \
            | xargs -0 cat \
            | tr -d '\r\n' > /tmp/samzaberu-v12.b64

          test "$(wc -c < /tmp/samzaberu-v12.b64)" -eq 392896
          base64 --decode /tmp/samzaberu-v12.b64 > /tmp/samzaberu-v12.zip
          echo "f86145a62257796508c965a81e5d5450fd6220dcf5c7494af8f43be889570212  /tmp/samzaberu-v12.zip" | sha256sum -c -
          unzip -tq /tmp/samzaberu-v12.zip

      - name: Import source files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/samzaberu-import
          mkdir -p /tmp/samzaberu-import
          unzip -q /tmp/samzaberu-v12.zip -d /tmp/samzaberu-import
          test -d /tmp/samzaberu-import/SamZaberu_GitHub_Ready_v1.2
          cp -a /tmp/samzaberu-import/SamZaberu_GitHub_Ready_v1.2/. .
          rm -rf .import-v12
          rm -f source-import.zip ABANDONED.txt DIRECT_TREE_PROBE.md DIRECT_TREE_PROBE_2.md

      - name: Commit source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import SamZaberu source v1.2"
          git push origin main
