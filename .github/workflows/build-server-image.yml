name: Build server image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-bullseye
        env:
          POSTGRES_DB: samzaberu
          POSTGRES_USER: samzaberu
          POSTGRES_PASSWORD: samzaberu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samzaberu -d samzaberu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=sha-${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test API and web interface
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail

          image_tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            docker pull "$image_tag"
          fi

          docker run -d \
            --name evrasia-ai-bot-smoke \
            --network host \
            -e PORT=18080 \
            -e DATABASE_URL=postgresql://samzaberu:samzaberu@127.0.0.1:5432/samzaberu \
            -e TELEGRAM_BOT_POLLING=disabled \
            -e PHONEBOOK_WEB_WRITE_TOKEN=smoke-secret \
            "$image_tag"

          cleanup() {
            docker logs --tail 100 evrasia-ai-bot-smoke || true
            docker rm -f evrasia-ai-bot-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:18080/api/healthz >/tmp/evrasia-ai-bot-health.json; then
              ready=1
              break
            fi

            if ! docker ps --filter name=evrasia-ai-bot-smoke --format '{{.Names}}' | grep -qx evrasia-ai-bot-smoke; then
              echo "Smoke-test container exited before becoming ready." >&2
              exit 1
            fi

            sleep 2
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "API did not become ready in time." >&2
            exit 1
          fi

          grep -Fq '"status":"ok"' /tmp/evrasia-ai-bot-health.json
          curl -fsS http://127.0.0.1:18080/ | grep -Fq 'id="root"'
          curl -fsS http://127.0.0.1:18080/client-route-check | grep -Fq 'id="root"'

          curl -fsS http://127.0.0.1:18080/phonebook | grep -Fq 'id="root"'
          test "$(curl -sS -o /tmp/old-directory-route.html -w '%{http_code}' http://127.0.0.1:18080/directory)" = "308"
          test "$(curl -sS -o /tmp/old-directory-api.json -w '%{http_code}' http://127.0.0.1:18080/api/directory/phones)" = "404"
          curl -fsS http://127.0.0.1:18080/api/phonebook/phones | grep -Fq '"records"'
          curl -fsS http://127.0.0.1:18080/api/phonebook/restaurants >/tmp/phonebook-restaurants.json
          test "$(jq '.records | length' /tmp/phonebook-restaurants.json)" = "62"
          test "$(curl -sS -o /tmp/phonebook-unauthorized.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -d '{"phone":"+7 921 000-00-01","operator":"MEGAFON","legalEntity":"ООО Тест"}' \
            http://127.0.0.1:18080/api/phonebook/phones)" = "401"

          # Добавлено 03.09.2026 ИТ Директор Евразии
          curl -fsS http://127.0.0.1:18080/antifraud | grep -Fq 'id="root"'
          curl -fsS http://127.0.0.1:18080/api/anti-fraud/summary >/tmp/antifraud-summary.json
          test "$(jq '.scoredAccounts' /tmp/antifraud-summary.json)" = "0"
          test "$(jq '.sharedDevices' /tmp/antifraud-summary.json)" = "0"
          test "$(jq '.updatedAt' /tmp/antifraud-summary.json)" = "null"

          # Добавлено 05.09.2026 ИТ Директор Евразии
          curl -fsS http://127.0.0.1:18080/api/anti-fraud/case-dynamics >/tmp/antifraud-dynamics.json
          test "$(jq '.records | length' /tmp/antifraud-dynamics.json)" = "0"

          # Обновлено 06.09.2026: 0017 разрешает штатный scheduler status=partial.
          # Также проверяем signed NUMERIC и loyalty resolution через psql,
          # не полагаясь на наличие standalone pg package в runtime image.
          migration_rows="$(
            docker run --rm \
              --network host \
              -e PGPASSWORD=samzaberu \
              postgres:16-bullseye \
              psql -h 127.0.0.1 -U samzaberu -d samzaberu -Atq \
                -c 'SELECT count(*) FROM drizzle.__drizzle_migrations;'
          )"
          test "$migration_rows" = "18"

          partial_status="$(
            docker run --rm -i \
              --network host \
              -e PGPASSWORD=samzaberu \
              postgres:16-bullseye \
              psql -h 127.0.0.1 -U samzaberu -d samzaberu \
                -v ON_ERROR_STOP=1 -Atq <<'SQL'
          BEGIN;
          INSERT INTO anti_fraud_sync_runs (run_id, source, status)
          VALUES ('ci-partial-status', 'ci-partial-status', 'partial');
          SELECT status FROM anti_fraud_sync_runs WHERE run_id = 'ci-partial-status';
          ROLLBACK;
          SQL
          )"
          test "$partial_status" = "partial"

          loyalty_columns="$(
            docker run --rm \
              --network host \
              -e PGPASSWORD=samzaberu \
              postgres:16-bullseye \
              psql -h 127.0.0.1 -U samzaberu -d samzaberu -Atq -F '|' \
                -c "SELECT count(*) FILTER (WHERE column_name='loyalty_active_card_count'), count(*) FILTER (WHERE column_name='loyalty_issue') FROM information_schema.columns WHERE table_schema='public' AND table_name='anti_fraud_accounts';"
          )"
          test "$loyalty_columns" = "1|1"

          signed_balance="$(
            docker run --rm -i \
              --network host \
              -e PGPASSWORD=samzaberu \
              postgres:16-bullseye \
              psql -h 127.0.0.1 -U samzaberu -d samzaberu \
                -v ON_ERROR_STOP=1 -Atq <<'SQL'
          BEGIN;
          INSERT INTO anti_fraud_accounts
            (bitrix_user_id, bitrix_active, bonus_balance, loyalty_active_card_count, loyalty_issue)
          VALUES
            (2147483000, true, -1.25, 4, 'multiple_active_cards');
          SELECT bonus_balance::text || '|' || loyalty_active_card_count::text || '|' || loyalty_issue
          FROM anti_fraud_accounts
          WHERE bitrix_user_id = 2147483000;
          ROLLBACK;
          SQL
          )"
          test "$signed_balance" = "-1.25|4|multiple_active_cards"
