name: Build v1.6.9 directory preview

on:
  push:
    branches:
      - feature/v1.6.9-directory-preview
  workflow_dispatch:

concurrency:
  group: directory-preview-v1.6.9
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-preview:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-bullseye
        env:
          POSTGRES_DB: samzaberu
          POSTGRES_USER: samzaberu
          POSTGRES_PASSWORD: samzaberu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samzaberu -d samzaberu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish directory-only preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.directory
          platforms: linux/amd64
          push: true
          pull: true
          tags: ghcr.io/juvantusik/evrasia_ai_bot:directory-preview-v1.6.9
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.6.9-preview
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=1.6.9-preview
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test isolated directory CRUD
        run: |
          set -Eeuo pipefail
          image=ghcr.io/juvantusik/evrasia_ai_bot:directory-preview-v1.6.9
          docker run -d \
            --name evrasia-directory-preview-smoke \
            --network host \
            -e PORT=18081 \
            -e DATABASE_URL=postgresql://samzaberu:samzaberu@127.0.0.1:5432/samzaberu \
            -e DIRECTORY_WEB_WRITE_TOKEN=preview-secret \
            "$image"

          cleanup() {
            docker logs --tail 120 evrasia-directory-preview-smoke || true
            docker rm -f evrasia-directory-preview-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:18081/api/healthz >/tmp/directory-health.json; then
              break
            fi
            sleep 2
          done

          grep -Fq '"status":"ok"' /tmp/directory-health.json
          grep -Fq '"service":"directory"' /tmp/directory-health.json
          curl -fsS http://127.0.0.1:18081/directory | grep -Fq 'id="root"'
          curl -fsS http://127.0.0.1:18081/api/directory/phones | grep -Fq '"records"'
          curl -fsS http://127.0.0.1:18081/api/directory/restaurants >/tmp/directory-restaurants.json
          test "$(jq '.records | length' /tmp/directory-restaurants.json)" = "62"

          test "$(curl -sS -o /tmp/no-samz.json -w '%{http_code}' http://127.0.0.1:18081/api/samzaberu/summary)" = "404"
          test "$(curl -sS -o /tmp/unauthorized.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -d '{"phone":"+7 921 000-00-01","operator":"MEGAFON","legalEntity":"ООО Тест"}' \
            http://127.0.0.1:18081/api/directory/phones)" = "401"

          curl -fsS -X POST \
            -H 'content-type: application/json' \
            -H 'x-directory-write-token: preview-secret' \
            -H 'x-directory-actor: GitHub Actions' \
            -d '{"cityPhone":"+7 812 900-00-01","federalPhone":"+7 921 000-00-01","operator":"MEGAFON","legalEntity":"ООО Тест","inn":"1234567890","accountNumber":"TEST-1"}' \
            http://127.0.0.1:18081/api/directory/phones >/tmp/created-phone.json
          phone_id="$(jq -r '.record.id' /tmp/created-phone.json)"
          test -n "$phone_id" && test "$phone_id" != "null"
          jq -e '.record.cityPhone == "78129000001" and .record.federalPhone == "79210000001"' /tmp/created-phone.json >/dev/null

          curl -fsS -X PUT \
            -H 'content-type: application/json' \
            -H 'x-directory-write-token: preview-secret' \
            -H 'x-directory-actor: GitHub Actions' \
            -d '{"cityPhone":"+7 812 900-00-01","federalPhone":"+7 921 000-00-02","operator":"MEGAFON","legalEntity":"ООО Тест","inn":"1234567890","accountNumber":"TEST-2"}' \
            "http://127.0.0.1:18081/api/directory/phones/${phone_id}" | grep -Fq 'TEST-2'

          curl -fsS -X POST \
            -H 'content-type: application/json' \
            -H 'x-directory-write-token: preview-secret' \
            -H 'x-directory-actor: GitHub Actions' \
            -d '{"cityPhone":"+7 812 981-16-89","federalPhone":"+7 952 665-92-83","operator":"T2","legalEntity":"ООО Максимус СПБ — тест","inn":"7801418988","lineType":"Городской номер"}' \
            http://127.0.0.1:18081/api/directory/phones >/tmp/created-t2-pair.json
          t2_pair_id="$(jq -r '.record.id' /tmp/created-t2-pair.json)"
          jq -e '.record.phone == "78129811689" and .record.cityPhone == "78129811689" and .record.federalPhone == "79526659283"' /tmp/created-t2-pair.json >/dev/null
          curl -fsS http://127.0.0.1:18081/api/directory/phones >/tmp/phones-with-t2-pair.json
          jq -e --arg id "$t2_pair_id" '[.records[] | select(.id == $id and .cityPhone == "78129811689" and .federalPhone == "79526659283")] | length == 1' /tmp/phones-with-t2-pair.json >/dev/null

          curl -fsS -X PUT \
            -H 'content-type: application/json' \
            -H 'x-directory-write-token: preview-secret' \
            -H 'x-directory-actor: GitHub Actions' \
            -d '{"cityPhone":"+7 812 981-16-89","federalPhone":"+7 952 665-92-84","operator":"T2","legalEntity":"ООО Максимус СПБ — тест","inn":"7801418988","lineType":"Городской номер"}' \
            "http://127.0.0.1:18081/api/directory/phones/${t2_pair_id}" | grep -Fq '79526659284'

          curl -fsS -X PUT \
            -H 'content-type: application/json' \
            -H 'x-directory-write-token: preview-secret' \
            -H 'x-directory-actor: GitHub Actions' \
            -d '{"number":1,"ou":"ЕВ","legalEntity":"ООО Тест-ресторан","address":"Тестовая 1","actualDirector":"Тест Тестов","actualPhoneMode":"AUTO","actualPersonalPhone":"","generalDirector":"Тест Генеральный","generalPhoneMode":"NONE","generalPersonalPhone":"","email":"test@evrasia.spb.ru"}' \
            http://127.0.0.1:18081/api/directory/restaurants/1 | grep -Fq 'Тест-ресторан'

          curl -fsS http://127.0.0.1:18081/api/directory/audit | grep -Fq 'GitHub Actions'

          curl -fsS -X DELETE \
            -H 'x-directory-write-token: preview-secret' \
            -H 'x-directory-actor: GitHub Actions' \
            "http://127.0.0.1:18081/api/directory/phones/${phone_id}" >/tmp/deleted-phone.json
          grep -Fq '9210000002' /tmp/deleted-phone.json

          curl -fsS -X DELETE \
            -H 'x-directory-write-token: preview-secret' \
            -H 'x-directory-actor: GitHub Actions' \
            "http://127.0.0.1:18081/api/directory/phones/${t2_pair_id}" >/tmp/deleted-t2-pair.json
          grep -Fq '79526659284' /tmp/deleted-t2-pair.json

          docker restart evrasia-directory-preview-smoke >/dev/null
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:18081/api/healthz >/tmp/directory-health-after-restart.json; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18081/api/directory/restaurants >/tmp/directory-restaurants-after-restart.json
          jq -e '.records[] | select(.id == "1" and .legalEntity == "ООО Тест-ресторан")' /tmp/directory-restaurants-after-restart.json >/dev/null
          curl -fsS http://127.0.0.1:18081/api/directory/audit | grep -Fq 'GitHub Actions'
