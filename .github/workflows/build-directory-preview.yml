name: Build v1.6.9 directory preview

on:
  push:
    branches:
      - feature/v1.6.9-directory-preview
  workflow_dispatch:

concurrency:
  group: directory-preview-v1.6.9
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-preview:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-bullseye
        env:
          POSTGRES_DB: samzaberu
          POSTGRES_USER: samzaberu
          POSTGRES_PASSWORD: samzaberu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samzaberu -d samzaberu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          platforms: linux/amd64
          push: true
          pull: true
          tags: ghcr.io/juvantusik/evrasia_ai_bot:preview-v1.6.9
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.6.9-preview
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=1.6.9-preview
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test preview
        run: |
          set -Eeuo pipefail
          image=ghcr.io/juvantusik/evrasia_ai_bot:preview-v1.6.9
          docker run -d \
            --name evrasia-directory-preview-smoke \
            --network host \
            -e PORT=18081 \
            -e DATABASE_URL=postgresql://samzaberu:samzaberu@127.0.0.1:5432/samzaberu \
            -e TELEGRAM_BOT_POLLING=disabled \
            "$image"

          cleanup() {
            docker logs --tail 80 evrasia-directory-preview-smoke || true
            docker rm -f evrasia-directory-preview-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:18081/api/healthz >/tmp/preview-health.json; then
              break
            fi
            sleep 2
          done

          grep -Fq '"status":"ok"' /tmp/preview-health.json
          curl -fsS http://127.0.0.1:18081/directory | grep -Fq 'id="root"'
          curl -fsS http://127.0.0.1:18081/api/directory/phones | grep -Fq '"records"'
