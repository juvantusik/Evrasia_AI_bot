name: V5 offline safety checks

on:
  push:
    branches:
      - feature/samzaberu-api-v5-auth-contract
    paths:
      - '.github/workflows/v5-offline-safety.yml'
      - 'site-integration/samzaberu-v5/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-php:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout feature source (without stored credentials)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Execute isolated PHP checks (no network or writable source)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== 1. ENVIRONMENT ==='
          echo 'MODE=OFFLINE_PHP_ONLY'
          echo 'BITRIX_BOOTSTRAP=NO'
          echo 'DATABASE_CONNECTION=NO'
          echo 'PRODUCTION_WRITE=NO'
          echo 'SMS_SENT=NO'

          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            -v "$PWD:/workspace:ro" -w /workspace \
            php:8.4-cli sh -eu -c '
              php -v | head -n 1
              ROOT=site-integration/samzaberu-v5
              echo "=== V5 PUBLIC-LEGAL PRODUCTION UPGRADER SAFETY ==="
              bash -n "$ROOT/deployment/upgrade-public-legal-v5.sh"
              if bash "$ROOT/deployment/upgrade-public-legal-v5.sh" > /tmp/v5-public-legal-upgrader-denied.log 2>&1; then
                echo "FAIL: V5 production upgrader executed on CI"
                exit 1
              fi
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-public-legal-upgrader-denied.log
              grep -Fxq "DATABASE_WRITE=NO" /tmp/v5-public-legal-upgrader-denied.log
              grep -Fxq "V5_AUTH_ENABLED=NO" /tmp/v5-public-legal-upgrader-denied.log
              echo "PASS: deploy script Bash lint + fail-closed outside production"
              echo "=== V4 BUSINESS ROUTE REUSE: PINNED NO-BOOTSTRAP SOURCE READER ==="
              php -n -l "$ROOT/tests/diagnostics/V5V4BusinessRouteInventory.php"
              bash -n "$ROOT/tests/diagnostics/v5_v4_business_routes_readonly.sh"
              php "$ROOT/tests/diagnostics/V5V4BusinessRouteInventory.php" --self-test
              if bash "$ROOT/tests/diagnostics/v5_v4_business_routes_readonly.sh" /tmp/not-installed.php > /tmp/v5-v4-business-wrong-host.log 2>&1; then
                echo "FAIL: source-only reader permitted CI as production"
                exit 1
              fi
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-v4-business-wrong-host.log
              grep -Fxq "MODE=READ_ONLY" /tmp/v5-v4-business-wrong-host.log
              grep -Fxq "USER_DATA_READ=NO" /tmp/v5-v4-business-wrong-host.log
              echo "PASS: V4 routes lexer/selftest and explicit wrong-host denial"
              echo "=== V4 CURRENT CART READ / RESTAURANT BUSINESS CONTRACT ==="
              php -n -l "$ROOT/tests/diagnostics/V5V4CartServiceSourceInspect.php"
              bash -n "$ROOT/tests/diagnostics/v5_v4_cart_service_readonly.sh"
              php "$ROOT/tests/diagnostics/V5V4CartServiceSourceInspect.php" --self-test
              if bash "$ROOT/tests/diagnostics/v5_v4_cart_service_readonly.sh" /tmp/not-installed.php > /tmp/v5-v4-cart-wrong-host.log 2>&1; then
                echo "FAIL: cart inspector permitted CI as production"
                exit 1
              fi
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-v4-cart-wrong-host.log
              grep -Fxq "MODE=READ_ONLY" /tmp/v5-v4-cart-wrong-host.log
              grep -Fxq "USER_DATA_READ=NO" /tmp/v5-v4-cart-wrong-host.log
              echo "PASS: Cart/Restaurant source-only guarded inspection and wrong-host denial"
              echo "=== REAL V4 CartApiService -> STRONG V5 CART READER (FEATURE ONLY) ==="
              php -l "$ROOT/src/V5BitrixLockedCartFuserOwner.php"
              php -l "$ROOT/tests/V5BitrixLockedCartFuserOwnerTest.php"
              php -l "$ROOT/src/V5BitrixCartApiServiceReader.php"
              php -l "$ROOT/src/V5MySqlCartRead.php"
              php -l "$ROOT/src/V5AuthHttpHandler.php"
              php -l "$ROOT/src/V5HttpTransportBoundary.php"
              php -l "$ROOT/src/V5PhpHttpRequestFactory.php"
              php -l "$ROOT/src/V5MySqlStrongSessionStore.php"
              php -l "$ROOT/tests/V5CartBusinessReuseTest.php"
              echo "PASS: V4 reuse cart PHP files and service contract syntax"
              echo "=== V4 CartApiService FUSER SOURCE BOUNDARY ==="
              php -n -l "$ROOT/tests/diagnostics/V5CartFuserBusinessBoundary.php"
              bash -n "$ROOT/tests/diagnostics/v5_cart_fuser_business_boundary_readonly.sh"
              php "$ROOT/tests/diagnostics/V5CartFuserBusinessBoundary.php" --self-test
              if bash "$ROOT/tests/diagnostics/v5_cart_fuser_business_boundary_readonly.sh" /tmp/not-installed.php > /tmp/v5-cart-fuser-wrong-host.log 2>&1; then
                echo "FAIL: native CartApiService boundary ran in CI"
                exit 1
              fi
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-cart-fuser-wrong-host.log
              grep -Fxq "MODE=READ_ONLY" /tmp/v5-cart-fuser-wrong-host.log
              grep -Fxq "USER_DATA_READ=NO" /tmp/v5-cart-fuser-wrong-host.log
              echo "PASS: source-only native cart FUSER guard fails closed"
              echo "=== 2A. SERVER DIAGNOSTIC SYNTAX (NO EXECUTION) ==="
              bash -n "$ROOT/tests/diagnostics/v5_native_mfa_writer_order_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_native_recovery_merge_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_native_recovery_final_boundary_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_event_writer_inventory_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_confirmation_order_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_confirmation_transition_flow_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_update_receiver_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_confirmed_array_lineage_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5PhoneConfirmedArrayLineageAwkSelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_confirmation_semantic_boundary_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5PhoneConfirmationSemanticBoundarySelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_confirmed_expression_tokens_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5PhoneConfirmedExpressionTokensSelfTest.sh"
              php -n -l "$ROOT/tests/diagnostics/V5PhoneConfirmedExpressionTokens.php"
              echo "PASS: ten source-only scripts and parser selftests shell syntax, PHP tokenizer linted"
              echo "=== 2D. SANITIZED PHP TOKENS OF CONFIRMED EXPRESSIONS (SYNTHETIC) ==="
              bash "$ROOT/tests/diagnostics/V5PhoneConfirmedExpressionTokensSelfTest.sh" --synthetic-only
              echo "PASS: tokenizer ran positive and tampered source fixtures with no literal leaks"
              if bash "$ROOT/tests/diagnostics/v5_phone_confirmed_expression_tokens_readonly.sh" > /tmp/v5-phone-tokens-denial.log 2>&1; then
                echo "FAIL: token reader accepted CI sandbox as production"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-phone-tokens-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-phone-tokens-denial.log
              echo "PASS: source-token diagnostic fails closed outside pinned production host"
              echo "=== 2E. ACTIVE V4 PHONE METHODS VS COMMENTED LEGACY CODE ==="
              php -n -l "$ROOT/tests/diagnostics/V5ActiveV4PhoneLexicalMap.php"
              bash -n "$ROOT/tests/diagnostics/v5_active_v4_phone_lexical_map_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5ActiveV4PhoneLexicalMapSelfTest.sh"
              bash "$ROOT/tests/diagnostics/V5ActiveV4PhoneLexicalMapSelfTest.sh" --synthetic-only
              echo "PASS: active PHP functions/phone calls distinguished from commented legacy on synthetic fixtures"
              if bash "$ROOT/tests/diagnostics/v5_active_v4_phone_lexical_map_readonly.sh" > /tmp/v5-v4-active-map-denial.log 2>&1; then
                echo "FAIL: active V4 map accepted wrong CI host"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-v4-active-map-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-v4-active-map-denial.log
              echo "PASS: active V4 source map refuses wrong host before reading PHP"
              echo "=== 2F. ACTIVE V4 SIGNUP PHONE TABLE ARGUMENTS (SYNTHETIC) ==="
              php -n -l "$ROOT/tests/diagnostics/V5ActivePhoneSignupBoundary.php"
              bash -n "$ROOT/tests/diagnostics/V5ActivePhoneSignupBoundarySelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_active_phone_signup_boundary_readonly.sh"
              bash "$ROOT/tests/diagnostics/V5ActivePhoneSignupBoundarySelfTest.sh" --synthetic-only
              echo "PASS: active signup phone-add and helper method classifier accepts safe fixture and rejects commented decoys"
              if bash "$ROOT/tests/diagnostics/v5_active_phone_signup_boundary_readonly.sh" > /tmp/v5-signup-boundary-denial.log 2>&1; then
                echo "FAIL: active signup boundary accepted nonproduction host"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-signup-boundary-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-signup-boundary-denial.log
              echo "PASS: signup boundary audit fails closed on CI sandbox"
              echo "=== 2G. ACTIVE PHONE SMS TOKEN STORE CLASS OWNER SCAN (SYNTHETIC) ==="
              php -n -l "$ROOT/tests/diagnostics/V5PhoneAuthCheckStaticOwners.php"
              bash -n "$ROOT/tests/diagnostics/V5PhoneAuthCheckStaticOwnersSelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_auth_check_static_owners_readonly.sh"
              bash "$ROOT/tests/diagnostics/V5PhoneAuthCheckStaticOwnersSelfTest.sh" --synthetic-only
              echo "PASS: static phone helper class owners tested against real namespaced PHP source and comment tampering"
              if bash "$ROOT/tests/diagnostics/v5_phone_auth_check_static_owners_readonly.sh" > /tmp/v5-phone-owners-denial.log 2>&1; then
                echo "FAIL: PhoneAuth source-only class-owner audit accepted wrong host"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-phone-owners-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-phone-owners-denial.log
              echo "PASS: helper static-owner audit fails closed outside pinned production"
              echo "=== 2H. PHONEAUTH CHECK CONTROL: TWO CONDITIONS AND FIVE RETURNS ==="
              php -n -l "$ROOT/tests/diagnostics/V5PhoneAuthCheckReturnKinds.php"
              bash -n "$ROOT/tests/diagnostics/V5PhoneAuthCheckReturnKindsSelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_auth_check_return_kinds_readonly.sh"
              bash "$ROOT/tests/diagnostics/V5PhoneAuthCheckReturnKindsSelfTest.sh" --synthetic-only
              echo "PASS: real PHP lexer classified check condition/return kinds and rejected commented decoys"
              if bash "$ROOT/tests/diagnostics/v5_phone_auth_check_return_kinds_readonly.sh" > /tmp/v5-check-return-denial.log 2>&1; then
                echo "FAIL: PhoneAuth check return diagnostic accepted wrong CI host"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-check-return-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-check-return-denial.log
              echo "PASS: check return diagnostics deny other hosts before reading production sources"
              echo "=== 2I. MASKED COMPLETE PHONEAUTH CHECK RETURNS AND V4 CALL SITES ==="
              php -n -l "$ROOT/tests/diagnostics/V5PhoneCheckMaskedControlFlow.php"
              bash -n "$ROOT/tests/diagnostics/V5PhoneCheckMaskedControlFlowSelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_check_masked_control_flow_readonly.sh"
              bash "$ROOT/tests/diagnostics/V5PhoneCheckMaskedControlFlowSelfTest.sh" --synthetic-only
              echo "PASS: full control-flow token shapes and live V4 caller detection passed synthetic positive and negatives"
              if bash "$ROOT/tests/diagnostics/v5_phone_check_masked_control_flow_readonly.sh" > /tmp/v5-masked-check-denial.log 2>&1; then
                echo "FAIL: masked source scanner accepted wrong CI host"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-masked-check-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-masked-check-denial.log
              echo "PASS: masked source scanner denies CI host before production PHP reads"
              echo "=== 2Q. CUSER PHONE DELETE/ADD LEXICAL CONDITIONAL FLOW (SYNTHETIC) ==="
              php -n -l "$ROOT/tests/diagnostics/V5CoreUserPhoneReplaceFlow.php"
              bash -n "$ROOT/tests/diagnostics/v5_core_user_phone_replace_flow_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5CoreUserPhoneReplaceFlowSelfTest.sh"
              bash "$ROOT/tests/diagnostics/V5CoreUserPhoneReplaceFlowSelfTest.sh" --synthetic-only
              echo "PASS: masked conditional add and delete argument lexical origins"
              echo "=== 2P. CUSER UPDATE NATIVE PHONE REPLACE ARGUMENTS (SYNTHETIC) ==="
              php -n -l "$ROOT/tests/diagnostics/V5CoreUserPhoneReplaceArgs.php"
              bash -n "$ROOT/tests/diagnostics/v5_core_user_phone_replace_args_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5CoreUserPhoneReplaceArgsSelfTest.sh"
              bash "$ROOT/tests/diagnostics/V5CoreUserPhoneReplaceArgsSelfTest.sh" --synthetic-only
              echo "PASS: SHA pinned core phone mutation arguments, block relations and masking"
              echo "=== 2O. NATIVE USER PHONE FIELD / CORE USER UPDATE (SYNTHETIC) ==="
              php -n -l "$ROOT/tests/diagnostics/V5NativePhoneCoreUpdateBoundary.php"
              bash -n "$ROOT/tests/diagnostics/v5_native_phone_core_update_boundary_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_native_phone_core_observed_snapshot_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5NativePhoneCoreUpdateBoundarySelfTest.sh"
              bash "$ROOT/tests/diagnostics/V5NativePhoneCoreUpdateBoundarySelfTest.sh" --synthetic-only
              echo "PASS: native phone default and pinned core Update diagnostic synthetic guards"
              echo "=== 2N. TWO PINNED PHP CLASS OWNER / CONSTRUCTOR LINKAGE (SYNTHETIC) ==="
              php -n -l "$ROOT/tests/diagnostics/V5ObjectCheckClassLinkage.php"
              bash -n "$ROOT/tests/diagnostics/v5_object_check_class_linkage_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5ObjectCheckClassLinkageSelfTest.sh"
              bash "$ROOT/tests/diagnostics/V5ObjectCheckClassLinkageSelfTest.sh" --synthetic-only
              echo "PASS: class owner and FQCN comparison with masking, checksum and host denials"
              echo "=== 2M. PINNED OBJECT CHECK RECEIVER ORIGIN / IMPORTS (SYNTHETIC) ==="
              php -n -l "$ROOT/tests/diagnostics/V5ObjectCheckOriginNamespace.php"
              bash -n "$ROOT/tests/diagnostics/v5_object_check_origin_namespace_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5ObjectCheckOriginNamespaceSelfTest.sh"
              bash "$ROOT/tests/diagnostics/V5ObjectCheckOriginNamespaceSelfTest.sh" --synthetic-only
              echo "PASS: lexical origin/import fixtures and host/SHA denials passed"
              echo "=== 2L. PINNED OBJECT CHECK RECEIVER BINDING HINTS (SYNTHETIC) ==="
              php -n -l "$ROOT/tests/diagnostics/V5ObjectCheckReceiverBinding.php"
              bash -n "$ROOT/tests/diagnostics/V5ObjectCheckReceiverBindingSelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_object_check_receiver_binding_readonly.sh"
              bash "$ROOT/tests/diagnostics/V5ObjectCheckReceiverBindingSelfTest.sh" --synthetic-only
              if bash "$ROOT/tests/diagnostics/v5_object_check_receiver_binding_readonly.sh" > /tmp/v5-receiver-binding-denial.log 2>&1; then
                echo "FAIL: receiver-binding probe accepted wrong CI host"
                exit 1
              fi
              grep -Fxq "PHP_SCANNER_EXECUTED=NO" /tmp/v5-receiver-binding-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-receiver-binding-denial.log
              echo "PASS: receiver binding hints refuse wrong host before production reads"

              echo "=== 2K. UNRESOLVED OBJECT CHECK LOCATIONS (SYNTHETIC) ==="
              bash -n "$ROOT/tests/diagnostics/v5_object_check_locations_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5ObjectCheckLocationsSelfTest.sh"
              bash "$ROOT/tests/diagnostics/V5ObjectCheckLocationsSelfTest.sh" --synthetic-only
              if bash "$ROOT/tests/diagnostics/v5_object_check_locations_readonly.sh" > /tmp/v5-object-check-location-denial.log 2>&1; then
                echo "FAIL: object check locator accepted wrong CI host"
                exit 1
              fi
              grep -Fxq "PHP_SCANNER_EXECUTED=NO" /tmp/v5-object-check-location-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-object-check-location-denial.log
              echo "PASS: locator denies wrong host before approved source reads"

              echo "=== 2J. BOUNDED ACTIVE V4 PHONEAUTH CALLER DISCOVERY (SYNTHETIC) ==="
              php -n -l "$ROOT/tests/diagnostics/V5PhoneCheckActiveCallerDiscovery.php"
              bash -n "$ROOT/tests/diagnostics/V5PhoneCheckActiveCallerDiscoverySelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_check_active_caller_discovery_readonly.sh"
              bash "$ROOT/tests/diagnostics/V5PhoneCheckActiveCallerDiscoverySelfTest.sh" --synthetic-only
              echo "PASS: active aliased and full-class callers counted, PHP comments and sensitive source names excluded"
              if bash "$ROOT/tests/diagnostics/v5_phone_check_active_caller_discovery_readonly.sh" > /tmp/v5-phone-active-caller-denial.log 2>&1; then
                echo "FAIL: active caller discovery accepted CI host"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-phone-active-caller-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-phone-active-caller-denial.log
              echo "PASS: active caller discovery refuses nonproduction host before source access"


              echo "=== 2C. PHONE CONFIRMATION RHS + PERSISTENCE SOURCE PARSER REGRESSION ==="
              bash "$ROOT/tests/diagnostics/V5PhoneConfirmationSemanticBoundarySelfTest.sh" --synthetic-only
              echo "PASS: actual POSIX AWK executed both confirmation state fixtures and tamper denials"
              if bash "$ROOT/tests/diagnostics/v5_phone_confirmation_semantic_boundary_readonly.sh" > /tmp/v5-phone-semantic-denial.log 2>&1; then
                echo "FAIL: native phone confirmation semantic audit accepted CI host"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-phone-semantic-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-phone-semantic-denial.log
              echo "PASS: semantic phone audit fails closed outside pinned production source"
              echo "=== 2B. POSITIVE + NEGATIVE POSIX AWK REGRESSION (SYNTHETIC ONLY) ==="
              bash "$ROOT/tests/diagnostics/V5PhoneConfirmedArrayLineageAwkSelfTest.sh" --synthetic-only
              echo "PASS: real POSIX AWK executed safe synthetic source; altered anchors fail closed"
              if bash "$ROOT/tests/diagnostics/v5_phone_confirmed_array_lineage_readonly.sh" > /tmp/v5-phone-lineage-denial.log 2>&1; then
                echo "FAIL: phone lineage audit incorrectly accepted CI sandbox"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-phone-lineage-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-phone-lineage-denial.log
              echo "PASS: phone field lineage audit denied without production source access"
              if bash "$ROOT/tests/diagnostics/v5_phone_update_receiver_readonly.sh" > /tmp/v5-phone-update-denial.log 2>&1; then
                echo "FAIL: targeted phone update audit accepted CI host"
                exit 1
              fi
              grep -Fxq "BITRIX_BOOTSTRAP=NO" /tmp/v5-phone-update-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-phone-update-denial.log
              echo "PASS: update-receiver diagnostic fails closed outside pinned production host"
              if bash "$ROOT/tests/diagnostics/v5_phone_confirmation_transition_flow_readonly.sh" > /tmp/v5-phone-flow-denial.log 2>&1; then
                echo "FAIL: phone transition flow accepted CI sandbox"
                exit 1
              fi
              grep -Fxq "BITRIX_BOOTSTRAP=NO" /tmp/v5-phone-flow-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-phone-flow-denial.log
              echo "PASS: phone transition flow denied without production source access"
              if bash "$ROOT/tests/diagnostics/v5_phone_event_writer_inventory_readonly.sh" > /tmp/v5-phone-inventory-denial.log 2>&1; then
                echo "FAIL: production-only phone inventory accepted CI sandbox"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-phone-inventory-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-phone-inventory-denial.log
              echo "PASS: phone audit refused wrong host before source access"
              echo "=== 2. PHP LINT (ENTIRE ISOLATED V5 TREE) ==="
              find "$ROOT/src" "$ROOT/tests" "$ROOT/api" -type f -name "*.php" -print | sort > /tmp/v5-php-file-manifest
              test -s /tmp/v5-php-file-manifest
              lint_count=0
              while IFS= read -r file; do
                php -l "$file" >/dev/null
                lint_count=$((lint_count + 1))
              done < /tmp/v5-php-file-manifest
              printf "PASS: linted %s PHP files\n" "$lint_count"
              echo "=== 3. OFFLINE REGRESSION (PINNED 50 SUITES) ==="
              suite_count=0
              for suite in \
                AuthDecisionTest.php \
                ChallengeRulesTest.php \
                V5AuthHttpHandlerTest.php \
                V5HttpTransportBoundaryTest.php \
                V5AuthPoliciesTest.php \
                V5BitrixCurrentLegalCatalogTest.php \
                V5BitrixLockedSmsEligibilityTest.php \
                V5BitrixPasswordProofPortTest.php \
                V5BitrixPdoCompatibilityBridgeTest.php \
                V5BitrixStrongSessionBridgeIntegrationTest.php \
                V5CartBusinessReuseTest.php \
                V5BitrixLockedCartFuserOwnerTest.php \
                V5BitrixStagedSignupConsentWriterTest.php \
                V5FirstFactorAttemptGateTest.php \
                V5LoginWorkflowTest.php \
                V5MySqlAttemptWindowStoreTest.php \
                V5MySqlSmsOutboxTest.php \
                V5ChallengeConsumptionSqlRegressionTest.php \
                V5MySqlSmsOutboxTest.php \
                V5MySqlStrongSessionStoreTest.php \
                V5NativeMutationCoverageTest.php \
                V5NativeTotpStatusTest.php \
                V5PdoUserRowSourceTest.php \
                V5PublicContractsTest.php \
                V5RewriteContractTest.php \
                V5RouteMapTest.php \
                V5SecurityEventVersionsTest.php \
                V5SessionAssurancePolicyTest.php \
                V5SessionTokensTest.php \
                V5SiteAccountReaderTest.php \
                V5SignupNativeConsentPlanTest.php \
                V5SignupPersistenceEvidenceTest.php \
                V5SignupNativeReceiptReaderTest.php \
                V5SamzaberuSecondFactorPolicyTest.php \
                V5SmsLoginChallengeTest.php \
                V5SmsDispatchPolicyTest.php \
                V5SmsChallengeVerifierTest.php \
                V5SmsChallengeFactoryTest.php \
                V5PdoSmsConsumeStoreTest.php \
                V5SmsReservedDispatcherTest.php \
                V5PdoSmsQuotaReservationTest.php \
                V5SmsChallengeIssueCoordinatorTest.php \
                V5PdoSmsChallengeIssueStoreTest.php \
                V5SmsDispatchBudgetTest.php \
                V5NativeCUserAddCandidateTest.php \
                V5StagedBitrixSignupAdapterTest.php \
                V5StagedCUserSourceGateTest.php \
                V5StagedSignupCoordinatorTest.php \
                V5StagingNativeTransactionPermitTest.php \
                V5VerifiedBitrixNativeTransactionDepthTest.php; do
                test -f "$ROOT/tests/$suite"
                php "$ROOT/tests/$suite"
                suite_count=$((suite_count + 1))
              done
              test "$suite_count" -eq 50
              printf "PASS: %s approved offline suites completed\n" "$suite_count"
              echo "=== 4. NEGATIVE PRE-BOOTSTRAP GUARDS ==="
              if php "$ROOT/tests/integration/V5BitrixNativeDepthReadOnlyPreflight.php" > /tmp/v5-preflight-denial.log 2>&1; then
                echo "FAIL: preflight accepted missing staging acknowledgement"
                exit 1
              fi
              grep -Fxq "STAGING_BITRIX_BOOTSTRAP=NO" /tmp/v5-preflight-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-preflight-denial.log
              if php "$ROOT/tests/integration/V5BitrixNativeOrmTransactionAcceptance.php" > /tmp/v5-rollback-denial.log 2>&1; then
                echo "FAIL: rollback accepted missing staging acknowledgement"
                exit 1
              fi
