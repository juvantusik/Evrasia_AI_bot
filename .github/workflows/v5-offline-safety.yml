name: V5 offline safety checks

on:
  push:
    branches:
      - feature/samzaberu-api-v5-auth-contract
    paths:
      - '.github/workflows/v5-offline-safety.yml'
      - 'site-integration/samzaberu-v5/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-php:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout feature source (without stored credentials)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Execute isolated PHP checks (no network or writable source)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== 1. ENVIRONMENT ==='
          echo 'MODE=OFFLINE_PHP_ONLY'
          echo 'BITRIX_BOOTSTRAP=NO'
          echo 'DATABASE_CONNECTION=NO'
          echo 'PRODUCTION_WRITE=NO'
          echo 'SMS_SENT=NO'

          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            -v "$PWD:/workspace:ro" -w /workspace \
            php:8.4-cli sh -eu -c '
              php -v | head -n 1
              ROOT=site-integration/samzaberu-v5
              echo "=== 2A. SERVER DIAGNOSTIC SYNTAX (NO EXECUTION) ==="
              bash -n "$ROOT/tests/diagnostics/v5_native_mfa_writer_order_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_native_recovery_merge_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_native_recovery_final_boundary_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_event_writer_inventory_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_confirmation_order_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_confirmation_transition_flow_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_update_receiver_readonly.sh"
              echo "PASS: seven read-only Bitrix source audit scripts linted"
              if bash "$ROOT/tests/diagnostics/v5_phone_update_receiver_readonly.sh" > /tmp/v5-phone-update-denial.log 2>&1; then
                echo "FAIL: targeted phone update audit accepted CI host"
                exit 1
              fi
              grep -Fxq "BITRIX_BOOTSTRAP=NO" /tmp/v5-phone-update-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-phone-update-denial.log
              echo "PASS: update-receiver diagnostic fails closed outside pinned production host"
              if bash "$ROOT/tests/diagnostics/v5_phone_confirmation_transition_flow_readonly.sh" > /tmp/v5-phone-flow-denial.log 2>&1; then
                echo "FAIL: phone transition flow accepted CI sandbox"
                exit 1
              fi
              grep -Fxq "BITRIX_BOOTSTRAP=NO" /tmp/v5-phone-flow-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-phone-flow-denial.log
              echo "PASS: phone transition flow denied without production source access"
              if bash "$ROOT/tests/diagnostics/v5_phone_event_writer_inventory_readonly.sh" > /tmp/v5-phone-inventory-denial.log 2>&1; then
                echo "FAIL: production-only phone inventory accepted CI sandbox"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-phone-inventory-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-phone-inventory-denial.log
              echo "PASS: phone audit refused wrong host before source access"
              echo "=== 2. PHP LINT (ENTIRE ISOLATED V5 TREE) ==="
              find "$ROOT/src" "$ROOT/tests" "$ROOT/api" -type f -name "*.php" -print | sort > /tmp/v5-php-file-manifest
              test -s /tmp/v5-php-file-manifest
              lint_count=0
              while IFS= read -r file; do
                php -l "$file" >/dev/null
                lint_count=$((lint_count + 1))
              done < /tmp/v5-php-file-manifest
              printf "PASS: linted %s PHP files\n" "$lint_count"
              echo "=== 3. SYNTHETIC REGRESSION (PINNED 22 SUITES) ==="
              suite_count=0
              for suite in \
                AuthDecisionTest.php \
                ChallengeRulesTest.php \
                V5AuthHttpHandlerTest.php \
                V5AuthPoliciesTest.php \
                V5BitrixLockedSmsEligibilityTest.php \
                V5BitrixPasswordProofPortTest.php \
                V5BitrixPdoCompatibilityBridgeTest.php \
                V5FirstFactorAttemptGateTest.php \
                V5LoginWorkflowTest.php \
                V5MySqlAttemptWindowStoreTest.php \
                V5MySqlSmsOutboxTest.php \
                V5NativeMutationCoverageTest.php \
                V5NativeTotpStatusTest.php \
                V5PdoUserRowSourceTest.php \
                V5RewriteContractTest.php \
                V5RouteMapTest.php \
                V5SecurityEventVersionsTest.php \
                V5SessionAssurancePolicyTest.php \
                V5SiteAccountReaderTest.php \
                V5SmsDispatchBudgetTest.php \
                V5StagingNativeTransactionPermitTest.php \
                V5VerifiedBitrixNativeTransactionDepthTest.php; do
                test -f "$ROOT/tests/$suite"
                php "$ROOT/tests/$suite"
                suite_count=$((suite_count + 1))
              done
              test "$suite_count" -eq 22
              printf "PASS: %s approved offline suites completed\n" "$suite_count"
              echo "=== 4. NEGATIVE PRE-BOOTSTRAP GUARDS ==="
              if php "$ROOT/tests/integration/V5BitrixNativeDepthReadOnlyPreflight.php" > /tmp/v5-preflight-denial.log 2>&1; then
                echo "FAIL: preflight accepted missing staging acknowledgement"
                exit 1
              fi
              grep -Fxq "STAGING_BITRIX_BOOTSTRAP=NO" /tmp/v5-preflight-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-preflight-denial.log
              if php "$ROOT/tests/integration/V5BitrixNativeOrmTransactionAcceptance.php" > /tmp/v5-rollback-denial.log 2>&1; then
                echo "FAIL: rollback accepted missing staging acknowledgement"
                exit 1
              fi
              grep -Fxq "DATABASE_WRITE=NO" /tmp/v5-rollback-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-rollback-denial.log
              echo "PASS: both staging entrypoints rejected before bootstrap"
              echo "=== 5. RESULT ==="
              echo "FINAL_STATUS=PASS"
              echo "FINAL_RC=0"
              echo "REAL_STAGING_E2E=NOT_RUN"
            '
