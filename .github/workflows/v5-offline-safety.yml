name: V5 offline safety checks

on:
  push:
    branches:
      - feature/samzaberu-api-v5-auth-contract
    paths:
      - '.github/workflows/v5-offline-safety.yml'
      - 'site-integration/samzaberu-v5/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-php:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout feature source (without stored credentials)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Execute isolated PHP checks (no network or writable source)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== 1. ENVIRONMENT ==='
          echo 'MODE=OFFLINE_PHP_ONLY'
          echo 'BITRIX_BOOTSTRAP=NO'
          echo 'DATABASE_CONNECTION=NO'
          echo 'PRODUCTION_WRITE=NO'
          echo 'SMS_SENT=NO'

          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            -v "$PWD:/workspace:ro" -w /workspace \
            php:8.4-cli sh -eu -c '
              php -v | head -n 1
              ROOT=site-integration/samzaberu-v5
              echo "=== V5 PUBLIC-LEGAL PRODUCTION UPGRADER SAFETY ==="
              bash -n "$ROOT/deployment/upgrade-public-legal-v5.sh"
              if bash "$ROOT/deployment/upgrade-public-legal-v5.sh" > /tmp/v5-public-legal-upgrader-denied.log 2>&1; then
                echo "FAIL: V5 production upgrader executed on CI"
                exit 1
              fi
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-public-legal-upgrader-denied.log
              grep -Fxq "DATABASE_WRITE=NO" /tmp/v5-public-legal-upgrader-denied.log
              grep -Fxq "V5_AUTH_ENABLED=NO" /tmp/v5-public-legal-upgrader-denied.log
              echo "PASS: deploy script Bash lint + fail-closed outside production"
              echo "=== REAL MAIN-DOMAIN V5 PUBLIC REGISTRATION ROLLOUT SAFETY ==="
              bash -n "$ROOT/deployment/upgrade-public-registration-documents-v5.sh"
              if bash "$ROOT/deployment/upgrade-public-registration-documents-v5.sh" > /tmp/v5-registration-upgrader-denied.log 2>&1; then
                echo "FAIL: live public-registration updater ran in CI"
                exit 1
              fi
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-registration-upgrader-denied.log
              grep -Fxq "DATABASE_WRITE=NO" /tmp/v5-registration-upgrader-denied.log
              grep -Fxq "V4_MODIFIED=NO" /tmp/v5-registration-upgrader-denied.log
              grep -Fxq "V5_AUTH_ENABLED=NO" /tmp/v5-registration-upgrader-denied.log
              echo "PASS: guarded V5-only updater syntax and wrong-host refusal"
              echo "=== ACCEPTED TWO-FILE V5 BOOTSTRAP: ADDITIVE REGISTRATION PUBLISH ==="
              bash -n "$ROOT/deployment/upgrade-twofile-public-registration-v5.sh"
              php -n -l "$ROOT/tests/V5TwofilePublicRewriteManifestTest.php"
              php -n "$ROOT/tests/V5TwofilePublicRewriteManifestTest.php"
              if bash "$ROOT/deployment/upgrade-twofile-public-registration-v5.sh" > /tmp/v5-twofile-wrong-host.log 2>&1; then
                echo "FAIL: two-file production updater ran in CI"
                exit 1
              fi
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-twofile-wrong-host.log
              grep -Fxq "PUBLIC_V5_ROUTER_WRITE=NO" /tmp/v5-twofile-wrong-host.log
              grep -Fxq "API_V4_WRITE=NO" /tmp/v5-twofile-wrong-host.log
              grep -Fxq "LEGACY_INSTALLED_MANIFEST_WRITE=NO" /tmp/v5-twofile-wrong-host.log
              grep -Fxq "ORIGIN_HTTPS_ACCEPTED=NO" /tmp/v5-twofile-wrong-host.log
              echo "PASS: pinned two-file deployment stays closed outside exact Bitrix server"
              echo "=== REAL REGISTRATION DOCUMENTS: V5 ROUTE / SITE CODE LINT ==="
              php -l "$ROOT/api/v5/router.php"
              php -l "$ROOT/src/V5RouteMap.php"
              php -l "$ROOT/src/V5AuthHttpHandler.php"
              php -l "$ROOT/src/V5HttpTransportBoundary.php"
              php -l "$ROOT/src/V5ParallelHttpEntry.php"
              php -l "$ROOT/tests/V5PublicContractsTest.php"
              php -l "$ROOT/tests/V5RouteMapTest.php"
              echo "PASS: V5 real registration-documents route and reuse of installed legal catalog"
              echo "=== V5 SOLE API CUTOVER: V4 STILL ACTIVE UNTIL EVERY GATE ==="
              php -n -l "$ROOT/migration/V5V4ReplacementGate.php"
              php -n -l "$ROOT/tests/V5V4ReplacementGateTest.php"
              php "$ROOT/migration/V5V4ReplacementGate.php" "$ROOT/migration/v4-replacement-plan.json" > /tmp/v5-sole-api-gate.log
              grep -Fxq "MANIFEST_VALID=YES" /tmp/v5-sole-api-gate.log
              grep -Fxq "V4_SOURCE_REGISTRATIONS=62" /tmp/v5-sole-api-gate.log
              grep -Fxq "CURRENT_STATUS=V4_MUST_REMAIN_ACTIVE" /tmp/v5-sole-api-gate.log
              grep -Fxq "V4_AUTOMATIC_SHUTDOWN=NO" /tmp/v5-sole-api-gate.log
              php "$ROOT/tests/V5V4ReplacementGateTest.php"
              echo "PASS: one-API V5 target, route gaps explicit, V4 retirement fail closed"
              echo "=== V4 BUSINESS ROUTE REUSE: PINNED NO-BOOTSTRAP SOURCE READER ==="
              php -n -l "$ROOT/tests/diagnostics/V5V4BusinessRouteInventory.php"
              bash -n "$ROOT/tests/diagnostics/v5_v4_business_routes_readonly.sh"
              php "$ROOT/tests/diagnostics/V5V4BusinessRouteInventory.php" --self-test
              if bash "$ROOT/tests/diagnostics/v5_v4_business_routes_readonly.sh" /tmp/not-installed.php > /tmp/v5-v4-business-wrong-host.log 2>&1; then
                echo "FAIL: source-only reader permitted CI as production"
                exit 1
              fi
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-v4-business-wrong-host.log
              grep -Fxq "MODE=READ_ONLY" /tmp/v5-v4-business-wrong-host.log
              grep -Fxq "USER_DATA_READ=NO" /tmp/v5-v4-business-wrong-host.log
              echo "PASS: V4 routes lexer/selftest and explicit wrong-host denial"
              echo "=== V4 CURRENT CART READ / RESTAURANT BUSINESS CONTRACT ==="
              php -n -l "$ROOT/tests/diagnostics/V5V4CartServiceSourceInspect.php"
              bash -n "$ROOT/tests/diagnostics/v5_v4_cart_service_readonly.sh"
              php "$ROOT/tests/diagnostics/V5V4CartServiceSourceInspect.php" --self-test
              if bash "$ROOT/tests/diagnostics/v5_v4_cart_service_readonly.sh" /tmp/not-installed.php > /tmp/v5-v4-cart-wrong-host.log 2>&1; then
                echo "FAIL: cart inspector permitted CI as production"
                exit 1
              fi
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-v4-cart-wrong-host.log
              grep -Fxq "MODE=READ_ONLY" /tmp/v5-v4-cart-wrong-host.log
              grep -Fxq "USER_DATA_READ=NO" /tmp/v5-v4-cart-wrong-host.log
              echo "PASS: Cart/Restaurant source-only guarded inspection and wrong-host denial"
              echo "=== REAL V4 CartApiService -> STRONG V5 CART READER (FEATURE ONLY) ==="
              php -l "$ROOT/src/V5BitrixLockedCartFuserOwner.php"
              php -l "$ROOT/tests/V5BitrixLockedCartFuserOwnerTest.php"
              php -l "$ROOT/src/V5BitrixCartApiServiceReader.php"
              php -l "$ROOT/src/V5MySqlCartRead.php"
              php -l "$ROOT/src/V5AuthHttpHandler.php"
              php -l "$ROOT/src/V5HttpTransportBoundary.php"
              php -l "$ROOT/src/V5PhpHttpRequestFactory.php"
              php -l "$ROOT/src/V5MySqlStrongSessionStore.php"
              php -l "$ROOT/tests/V5CartBusinessReuseTest.php"
              echo "PASS: V4 reuse cart PHP files and service contract syntax"
              echo "=== V4 CartApiService FUSER SOURCE BOUNDARY ==="
              php -n -l "$ROOT/tests/diagnostics/V5CartFuserBusinessBoundary.php"
              bash -n "$ROOT/tests/diagnostics/v5_cart_fuser_business_boundary_readonly.sh"
              php "$ROOT/tests/diagnostics/V5CartFuserBusinessBoundary.php" --self-test
              if bash "$ROOT/tests/diagnostics/v5_cart_fuser_business_boundary_readonly.sh" /tmp/not-installed.php > /tmp/v5-cart-fuser-wrong-host.log 2>&1; then
                echo "FAIL: native CartApiService boundary ran in CI"
                exit 1
              fi
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-cart-fuser-wrong-host.log
              grep -Fxq "MODE=READ_ONLY" /tmp/v5-cart-fuser-wrong-host.log
              grep -Fxq "USER_DATA_READ=NO" /tmp/v5-cart-fuser-wrong-host.log
              echo "PASS: source-only native cart FUSER guard fails closed"
              echo "=== 2A. SERVER DIAGNOSTIC SYNTAX (NO EXECUTION) ==="
              bash -n "$ROOT/tests/diagnostics/v5_native_mfa_writer_order_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_native_recovery_merge_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_native_recovery_final_boundary_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_event_writer_inventory_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_confirmation_order_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_confirmation_transition_flow_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_update_receiver_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_confirmed_array_lineage_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5PhoneConfirmedArrayLineageAwkSelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_confirmation_semantic_boundary_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5PhoneConfirmationSemanticBoundarySelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_confirmed_expression_tokens_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5PhoneConfirmedExpressionTokensSelfTest.sh"
              php -n -l "$ROOT/tests/diagnostics/V5PhoneConfirmedExpressionTokens.php"
              echo "PASS: ten source-only scripts and parser selftests shell syntax, PHP tokenizer linted"
              echo "=== 2D. SANITIZED PHP TOKENS OF CONFIRMED EXPRESSIONS (SYNTHETIC) ==="
              bash "$ROOT/tests/diagnostics/V5PhoneConfirmedExpressionTokensSelfTest.sh" --synthetic-only
              echo "PASS: tokenizer ran positive and tampered source fixtures with no literal leaks"
              if bash "$ROOT/tests/diagnostics/v5_phone_confirmed_expression_tokens_readonly.sh" > /tmp/v5-phone-tokens-denial.log 2>&1; then
                echo "FAIL: token reader accepted CI sandbox as production"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-phone-tokens-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-phone-tokens-denial.log
              echo "PASS: source-token diagnostic fails closed outside pinned production host"
              echo "=== 2E. ACTIVE V4 PHONE METHODS VS COMMENTED LEGACY CODE ==="
              php -n -l "$ROOT/tests/diagnostics/V5ActiveV4PhoneLexicalMap.php"
              bash -n "$ROOT/tests/diagnostics/v5_active_v4_phone_lexical_map_readonly.sh"
              bash -n "$ROOT/tests/diagnostics/V5ActiveV4PhoneLexicalMapSelfTest.sh"
              bash "$ROOT/tests/diagnostics/V5ActiveV4PhoneLexicalMapSelfTest.sh" --synthetic-only
              echo "PASS: active PHP functions/phone calls distinguished from commented legacy on synthetic fixtures"
              if bash "$ROOT/tests/diagnostics/v5_active_v4_phone_lexical_map_readonly.sh" > /tmp/v5-v4-active-map-denial.log 2>&1; then
                echo "FAIL: active V4 map accepted wrong CI host"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-v4-active-map-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-v4-active-map-denial.log
              echo "PASS: active V4 source map refuses wrong host before reading PHP"
              echo "=== 2F. ACTIVE V4 SIGNUP PHONE TABLE ARGUMENTS (SYNTHETIC) ==="
              php -n -l "$ROOT/tests/diagnostics/V5ActivePhoneSignupBoundary.php"
              bash -n "$ROOT/tests/diagnostics/V5ActivePhoneSignupBoundarySelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_active_phone_signup_boundary_readonly.sh"
              bash "$ROOT/tests/diagnostics/V5ActivePhoneSignupBoundarySelfTest.sh" --synthetic-only
              echo "PASS: active signup phone-add and helper method classifier accepts safe fixture and rejects commented decoys"
              if bash "$ROOT/tests/diagnostics/v5_active_phone_signup_boundary_readonly.sh" > /tmp/v5-signup-boundary-denial.log 2>&1; then
                echo "FAIL: active signup boundary accepted nonproduction host"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-signup-boundary-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-signup-boundary-denial.log
              echo "PASS: signup boundary audit fails closed on CI sandbox"
              echo "=== 2G. ACTIVE PHONE SMS TOKEN STORE CLASS OWNER SCAN (SYNTHETIC) ==="
              php -n -l "$ROOT/tests/diagnostics/V5PhoneAuthCheckStaticOwners.php"
              bash -n "$ROOT/tests/diagnostics/V5PhoneAuthCheckStaticOwnersSelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_auth_check_static_owners_readonly.sh"
              bash "$ROOT/tests/diagnostics/V5PhoneAuthCheckStaticOwnersSelfTest.sh" --synthetic-only
              echo "PASS: static phone helper class owners tested against real namespaced PHP source and comment tampering"
              if bash "$ROOT/tests/diagnostics/v5_phone_auth_check_static_owners_readonly.sh" > /tmp/v5-phone-owners-denial.log 2>&1; then
                echo "FAIL: PhoneAuth source-only class-owner audit accepted wrong host"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-phone-owners-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-phone-owners-denial.log
              echo "PASS: helper static-owner audit fails closed outside pinned production"
              echo "=== 2H. PHONEAUTH CHECK CONTROL: TWO CONDITIONS AND FIVE RETURNS ==="
              php -n -l "$ROOT/tests/diagnostics/V5PhoneAuthCheckReturnKinds.php"
              bash -n "$ROOT/tests/diagnostics/V5PhoneAuthCheckReturnKindsSelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_auth_check_return_kinds_readonly.sh"
              bash "$ROOT/tests/diagnostics/V5PhoneAuthCheckReturnKindsSelfTest.sh" --synthetic-only
              echo "PASS: real PHP lexer classified check condition/return kinds and rejected commented decoys"
              if bash "$ROOT/tests/diagnostics/v5_phone_auth_check_return_kinds_readonly.sh" > /tmp/v5-check-return-denial.log 2>&1; then
                echo "FAIL: PhoneAuth check return diagnostic accepted wrong CI host"
                exit 1
              fi
              grep -Fxq "DATABASE_CONNECTION=NO" /tmp/v5-check-return-denial.log
              grep -Fxq "FINAL_STATUS=FAIL" /tmp/v5-check-return-denial.log
              echo "PASS: check return diagnostics deny other hosts before reading production sources"
              echo "=== 2I. MASKED COMPLETE PHONEAUTH CHECK RETURNS AND V4 CALL SITES ==="
              php -n -l "$ROOT/tests/diagnostics/V5PhoneCheckMaskedControlFlow.php"
              bash -n "$ROOT/tests/diagnostics/V5PhoneCheckMaskedControlFlowSelfTest.sh"
              bash -n "$ROOT/tests/diagnostics/v5_phone_check_masked_control_flow_readonly.sh"
              bash "$ROOT/tests/diagnostics/V5PhoneCheckMaskedControlFlowSelfTest.sh" --synthetic-only
