name: V5 checkout source-only admission
on:
  push:
    branches:
      - feature/v5-production-native-preflight-20261025
    paths:
      - .github/workflows/v5-checkout-source-only.yml
      - site-integration/samzaberu-v5/src/V5BitrixSaleD7OrderBuilder.php
      - site-integration/samzaberu-v5/tests/V5BitrixSaleD7OrderBuilderTest.php
      - site-integration/samzaberu-v5/src/V5BitrixCheckoutBusinessRules.php
      - site-integration/samzaberu-v5/src/V5BitrixLockedPickupOrderWriter.php
      - site-integration/samzaberu-v5/src/V5BitrixPdoCompatibilityBridge.php
      - site-integration/samzaberu-v5/src/V5BitrixNativePickupCartCleanup.php
      - site-integration/samzaberu-v5/src/V5BitrixNativePickupSavedOrderProof.php
      - site-integration/samzaberu-v5/src/V5NativePickupCheckoutComposition.php
      - site-integration/samzaberu-v5/src/V5BitrixNativeCartMutator.php
      - site-integration/samzaberu-v5/src/V5BitrixExistingCartAdder.php
      - site-integration/samzaberu-v5/tests/V5CartAddHttpTest.php
      - site-integration/samzaberu-v5/tests/V5CartSourceParityTest.php
      - site-integration/samzaberu-v5/deployment/snapshot-working-v4-for-v5-reuse.sh
      - site-integration/samzaberu-v5/src/V5CartMutationRequest.php
      - site-integration/samzaberu-v5/src/V5MySqlCartMutation.php
      - site-integration/samzaberu-v5/src/V5MySqlPublicComposition.php
      - site-integration/samzaberu-v5/src/V5MySqlPilotComposition.php
      - site-integration/samzaberu-v5/tests/V5CartMutationHttpTest.php
      - site-integration/samzaberu-v5/tests/V5NativePickupCheckoutCompositionTest.php
      - site-integration/samzaberu-v5/tests/V5BitrixPdoCompatibilityBridgeTest.php
      - site-integration/samzaberu-v5/src/V5BitrixNativePickupMaterializer.php
      - site-integration/samzaberu-v5/src/V5PinnedPickupPropertyPolicy.php
      - site-integration/samzaberu-v5/tests/V5PinnedPickupPropertyPolicyTest.php
      - site-integration/samzaberu-v5/src/V5PickupFreshBasketAssembler.php
      - site-integration/samzaberu-v5/tests/V5PickupFreshBasketAssemblerTest.php
      - site-integration/samzaberu-v5/tests/V5BitrixNativePickupMaterializerTest.php
      - site-integration/samzaberu-v5/tests/V5LockedPickupOrderWriterTest.php
      - site-integration/samzaberu-v5/tests/V5BitrixCheckoutBusinessRulesTest.php
      - site-integration/samzaberu-v5/src/V5CheckoutRequest.php
      - site-integration/samzaberu-v5/src/V5MySqlOrderPlace.php
      - site-integration/samzaberu-v5/src/V5RouteMap.php
      - site-integration/samzaberu-v5/src/V5AuthHttpHandler.php
      - site-integration/samzaberu-v5/src/V5MySqlStrongSessionStore.php
      - site-integration/samzaberu-v5/tests/V5IndependentCheckoutHttpTest.php
  workflow_dispatch:

jobs:
  http-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax, source only
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=site-integration/samzaberu-v5
          php -v | head -n 2
          for file in \
            src/V5BitrixSaleD7OrderBuilder.php \
            src/V5BitrixCheckoutBusinessRules.php \
            src/V5BitrixLockedPickupOrderWriter.php \
            src/V5BitrixPdoCompatibilityBridge.php \
            src/V5BitrixNativePickupCartCleanup.php \
            src/V5BitrixNativePickupSavedOrderProof.php \
            src/V5NativePickupCheckoutComposition.php \
            src/V5BitrixNativeCartMutator.php \
            src/V5BitrixExistingCartAdder.php \
            src/V5CartMutationRequest.php \
            src/V5MySqlCartMutation.php \
            src/V5BitrixNativePickupMaterializer.php \
            src/V5PinnedPickupPropertyPolicy.php \
            src/V5PickupFreshBasketAssembler.php \
            src/V5CheckoutRequest.php \
            src/V5MySqlOrderPlace.php \
            src/V5RouteMap.php \
            src/V5ProductionNativeRequestBoundaryGuard.php \
            src/V5AuthHttpHandler.php \
            src/V5MySqlStrongSessionStore.php \
            src/V5MySqlPublicComposition.php \
            src/V5MySqlPilotComposition.php \
            tests/V5IndependentCheckoutHttpTest.php \
            tests/V5BitrixSaleD7OrderBuilderTest.php \
            tests/V5BitrixCheckoutBusinessRulesTest.php \
            tests/V5LockedPickupOrderWriterTest.php \
            tests/V5BitrixPdoCompatibilityBridgeTest.php \
            tests/V5NativePickupCheckoutCompositionTest.php \
            tests/V5CartMutationHttpTest.php \
            tests/V5CartAddHttpTest.php \
            tests/V5CartSourceParityTest.php \
            tests/V5BitrixNativePickupMaterializerTest.php \
            tests/V5PinnedPickupPropertyPolicyTest.php \
            tests/V5PickupFreshBasketAssemblerTest.php; do
            php -l "$BASE/$file"
          done
      - name: Independent V5 checkout request and HTTP admission
        run: php site-integration/samzaberu-v5/tests/V5IndependentCheckoutHttpTest.php
      - name: V5 native Sale D7 order builder mock-only
        run: php site-integration/samzaberu-v5/tests/V5BitrixSaleD7OrderBuilderTest.php
      - name: V5 on-site pickup checkout business rules (mock-only)
        run: php site-integration/samzaberu-v5/tests/V5BitrixCheckoutBusinessRulesTest.php
      - name: V5 checkout locked native writer idempotency (mock-only)
        run: php site-integration/samzaberu-v5/tests/V5LockedPickupOrderWriterTest.php
      - name: V5 native pickup materializer (mock-only)
        run: php site-integration/samzaberu-v5/tests/V5BitrixNativePickupMaterializerTest.php
      - name: V5 native fresh server-priced basket (mock-only)
        run: php site-integration/samzaberu-v5/tests/V5PickupFreshBasketAssemblerTest.php
      - name: V5 pinned on-site pickup property policy (mock-only)
        run: php site-integration/samzaberu-v5/tests/V5PinnedPickupPropertyPolicyTest.php
      - name: V5 native bridge checkout SQL and cleanup fail closed (mock-only)
        run: php site-integration/samzaberu-v5/tests/V5BitrixPdoCompatibilityBridgeTest.php
      - name: V5 strict native checkout composition wiring (mock-only)
        run: php site-integration/samzaberu-v5/tests/V5NativePickupCheckoutCompositionTest.php
      - name: V5 cart native mutation routes and owner-protected DTO (mock-only)
        run: php site-integration/samzaberu-v5/tests/V5CartMutationHttpTest.php
      - name: V5 existing custom-cart product add contract and strict server catalog (mock-only)
        run: php site-integration/samzaberu-v5/tests/V5CartAddHttpTest.php
      - name: V5 source-of-truth parity (custom API basket, no D7 fallback)
        run: php site-integration/samzaberu-v5/tests/V5CartSourceParityTest.php
      - name: Review proven V4 reuse snapshot syntax (no production connection)
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n site-integration/samzaberu-v5/deployment/snapshot-working-v4-for-v5-reuse.sh
